<!DOCTYPE html>
<!-- rebuilt from scratch — layout mirrors guns.lol/5HP profile, original assets pulled locally -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@𝕭𝖆𝖓𝖉𝖎𝖙</title>
<meta name="author" content="@𝕭𝖆𝖓𝖉𝖎𝖙">  <meta name="description" content="Follow my socials u fan...">
<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/favicon.png">
<style>
:root{
  --fg:#f0f0f0;
  --muted:#cfcfcf;
  --stroke:rgba(255,255,255,.16);
  --font:system-ui,-apple-system,'Segoe UI','Outfit',sans-serif;
}
/* smooth instant presence swap */
.presence .seen{transition:opacity .15s ease}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:var(--fg);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden}
body.layout{overflow-y:auto;overflow-x:hidden}
body::selection{background:#fff;color:#000}

/* ---------- background ---------- */
#bgwrap{position:fixed;inset:0;z-index:0;overflow:hidden}
#bg{position:absolute;top:50%;left:50%;width:100vw;height:100vh;object-fit:cover;
  transform:translate(-50%,-50%)}
#bgdim{position:absolute;inset:0;background:radial-gradient(ellipse 120% 90% at center,
  rgba(0,0,0,.10) 0%,rgba(0,0,0,.30) 78%,rgba(0,0,0,.45) 100%)}

/* ---------- entry gate ---------- */
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;cursor:pointer;user-select:none;
  background:rgba(0,0,0,.28);backdrop-filter:blur(30px) brightness(.62) saturate(1.25);
  transition:opacity .6s ease,visibility .6s ease;
  animation:gateIn 1.2s ease both}
#gate.hidden{opacity:0;visibility:hidden;pointer-events:none;backdrop-filter:none}
@keyframes gateIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
#gate.hidden{opacity:0;visibility:hidden;pointer-events:none}
#gate .info-circle{width:46px;height:46px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 22px rgba(0,0,0,.45);
  animation:bob 3s ease-in-out infinite}
#gate .info-circle svg{width:26px;height:26px;fill:#0a0a0a}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#gate .click-txt{font-size:clamp(22px,3.4vw,30px);font-weight:800;color:#fff;letter-spacing:.02em;
  text-shadow:0 2px 10px rgba(0,0,0,.5)}
#gate .click-sub{font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}
#gate:hover .info-circle{box-shadow:0 0 26px rgba(255,255,255,.55)}

/* ---------- center column ---------- */
#main{position:relative;z-index:10;min-height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:9vh 20px 46px;
  transition:opacity .7s ease}
#main.hidden{opacity:0}

/* entrance: every profile element rises in, staggered after the gate click */
#main>*{opacity:0;transform:translateY(26px) scale(.97)}
#main>*{will-change:opacity,transform}
body.entered #main>*{transition:opacity .55s ease,transform .55s cubic-bezier(.22,.9,.28,1)}
body.entered #main>*{opacity:1;transform:none}
body.entered #main.waapi>*{opacity:1 !important;transform:none !important}

.glow-txt{
  color:#fff;
  text-shadow:0 0 8px rgba(255,255,255,.55),0 0 22px rgba(255,255,255,.35),0 0 48px rgba(255,255,255,.22);
}
h1.name{
  font-size:clamp(34px,7vw,58px);font-weight:800;letter-spacing:.04em;line-height:1.05;
  min-height:1.2em;position:relative;
}
/* ---------- glitch ---------- */
h1.name::before,h1.name::after{
  content:attr(data-text);position:absolute;left:0;top:0;width:100%;
  text-shadow:none;color:#fff;pointer-events:none;opacity:.85;
}
h1.name::before{animation:glitch-a 1.1s infinite steps(2,end)}
h1.name::after{animation:glitch-b 0.85s infinite steps(2,end)}
@keyframes glitch-a{
  0%{clip-path:inset(0 0 82% 0);transform:translate(-4px,0)}
  22%{clip-path:inset(24% 0 46% 0);transform:translate(5px,-1px)}
  45%{clip-path:inset(80% 0 4% 0);transform:translate(-5px,1px)}
  65%{clip-path:inset(40% 0 38% 0);transform:translate(3px,0)}
  100%{clip-path:inset(0 0 0 0);transform:translate(0,0)}
}
@keyframes glitch-b{
  0%{clip-path:inset(62% 0 12% 0);transform:translate(4px,0)}
  30%{clip-path:inset(8% 0 74% 0);transform:translate(-4px,1px)}
  58%{clip-path:inset(48% 0 30% 0);transform:translate(6px,-1px)}
  100%{clip-path:inset(0 0 0 0);transform:translate(0,0)}
}
/* rgb split pulses */
h1.name::before{color:rgba(0,255,255,.55)}
h1.name::after{color:rgba(255,0,128,.55)}
.display-name{
  margin-top:2px;font-size:clamp(14px,2.4vw,19px);font-weight:600;letter-spacing:.12em;
  color:var(--muted);
}

/* badges row — icon-only chips, custom glow per badge */
.badges{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:12px}
.badge{display:inline-flex;align-items:center;cursor:default}
.badge svg{width:22px;height:22px}
.badge.diamond svg{filter:drop-shadow(0 0 7px rgba(180,220,255,.75)) drop-shadow(0 0 14px rgba(120,180,255,.4))}
.badge.owner svg{filter:drop-shadow(0 0 7px rgba(255,193,64,.85)) drop-shadow(0 0 15px rgba(240,178,50,.5))}
.badge.verified svg{filter:drop-shadow(0 0 7px rgba(88,101,242,.65)) drop-shadow(0 0 14px rgba(88,101,242,.35))}

/* music reactor — compact spectrum bars beside the player */
.reactor{flex:none;height:38px;min-width:64px;display:flex;align-items:center}
.reactor canvas{width:64px;height:38px;display:block}

/* ---------- lyric word field (below center column z, above background) ---------- */
#lyrfield{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
#lyrfield .lyr{position:absolute;color:rgba(255,255,255,.92);white-space:nowrap;
  opacity:0;letter-spacing:.01em;
  text-shadow:0 2px 12px rgba(0,0,0,.65);will-change:transform}
#lyrfield .lyr.go{animation-play-state:running}
#lyrfield .lyr:not(.go){animation-play-state:paused !important}
#lyrfield .lyr b{font-weight:inherit}
#lyrfield .lyr .rr{color:#ff4545;text-shadow:0 2px 16px rgba(255,60,60,.55)}
#lyrfield .lyr.red{color:#ff4545;text-shadow:0 2px 16px rgba(255,60,60,.55)}
#lyphud{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);z-index:40;
  background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.25);border-radius:10px;
  padding:10px 18px;color:#ffd76a;font-weight:700;font-size:15px;letter-spacing:.03em;
  pointer-events:none}
#lyrfield .lyr.a{animation:lyrA 2.6s ease-in-out forwards}
#lyrfield .lyr.b{animation:lyrB 2.4s ease forwards}
#lyrfield .lyr.c{animation:lyrC 3s ease-in-out forwards}
#lyrfield .lyr.d{animation:lyrD 2.8s ease-in-out forwards}
/* every variant: clean eased fade-in, held, clean eased fade-out — monotonic transforms only */
@keyframes lyrA{
  0%{opacity:0;transform:scale(.8) rotate(var(--rot,0deg))}
  16%{opacity:1}
  72%{opacity:1}
  100%{opacity:0;transform:scale(1.06) rotate(var(--rot,0deg))}}
@keyframes lyrB{
  0%{opacity:0;transform:translateX(-26px) scale(1.02)}
  18%{opacity:1}
  74%{opacity:1}
  100%{opacity:0;transform:translateX(14px) scale(1)}}
@keyframes lyrC{
  0%{opacity:0;transform:translateY(14px)}
  18%{opacity:1}
  72%{opacity:1}
  100%{opacity:0;transform:translateY(-10px)}}
@keyframes lyrD{
  0%{opacity:0;transform:scale(1.16) rotate(var(--rot,0deg))}
  16%{opacity:1}
  72%{opacity:1}
  100%{opacity:0;transform:scale(1.02) rotate(var(--rot,0deg))}}
/* dying: motion freeze only — the JS fade handles opacity so despawn never snaps */
#lyrfield .lyr.dying{animation-play-state:paused}

.description{margin-top:16px;font-size:clamp(14px,2.4vw,17px);font-weight:600;color:#fff;
  text-shadow:0 0 10px rgba(255,255,255,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:88vw;min-height:1.4em}
.description .tw-cursor{display:inline-block;width:2px;height:1em;background:#fff;
  margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* location row */
.loc{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:#e5e5e5}
.loc svg{width:13px;height:13px;fill:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.4))}

/* shared hover tooltip (badges, socials, views) */
[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
  background:rgba(10,10,10,.9);border:1px solid var(--stroke);border-radius:8px;
  color:#fff;font-size:12px;font-weight:600;letter-spacing:.04em;white-space:nowrap;
  padding:6px 10px;pointer-events:none;opacity:0;transition:opacity .18s ease,transform .18s ease;
  z-index:30;
}
[data-tip]:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}

/* discord presence card */
.presence{margin-top:22px;display:flex;align-items:center;gap:14px;
  background:rgba(0,0,0,.6);
  border:1px solid var(--stroke);border-radius:14px;padding:10px 22px 10px 12px}
.presence .disc-av{width:52px;height:52px;border-radius:50%;background:#000;
  display:flex;align-items:center;justify-content:center;flex:none;
  border:1px solid var(--stroke)}
.presence .disc-av img{width:30px;height:30px}
.presence .meta{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.presence .uname{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:#fff}
.presence .uname svg{width:14px;height:14px;fill:#5865F2;filter:drop-shadow(0 0 3px rgba(88,101,242,.5))}
.presence .seen{font-size:12px;color:var(--muted);font-style:italic}
.presence .seen .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#23a55a;margin-right:5px;vertical-align:1px;
  box-shadow:0 0 6px rgba(35,165,90,.9);animation:blink 1.6s infinite}
.presence .seen .live-dot.idle{background:#f0b232;box-shadow:0 0 6px rgba(240,178,50,.9)}
.presence .seen .live-dot.dnd{background:#f23f43;box-shadow:0 0 6px rgba(242,63,67,.9)}

/* social icons */
.socials{display:flex;gap:20px;margin-top:22px}
.soc{width:46px;height:46px;display:flex;align-items:center;justify-content:center;
  color:#fff;transition:transform .18s ease,filter .18s ease}
.soc svg{width:26px;height:26px;fill:currentColor;
  filter:drop-shadow(0 0 6px rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(255,255,255,.22))}
.soc:hover{transform:translateY(-3px) scale(1.08);filter:drop-shadow(0 0 10px rgba(255,255,255,.55))}

/* ---------- player (under socials) ---------- */
.player{display:flex;align-items:center;gap:14px;
  background:rgba(0,0,0,.6);
  border:1px solid var(--stroke);border-radius:14px;padding:12px 16px;
  margin-top:26px;width:min(516px,94vw)}
.views{display:flex;align-items:center;gap:6px;font-size:15px;font-variant-numeric:tabular-nums;
  color:#fff;flex:none;padding-right:6px;border-right:1px solid var(--stroke)}
.views svg{width:17px;height:17px;fill:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.4))}
.views #views{transition:opacity .2s ease}
.player.hidden{opacity:0;pointer-events:none}
.codebtn{flex:none;cursor:default;display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:9px;transition:background .2s}
.codebtn:hover{background:transparent}
.codebtn svg{width:20px;height:20px;fill:#fff;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.3))}
.player .core{flex:1;min-width:0}
.track-title{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-align:left}
.track-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.track-row .time{font-size:11px;color:#d8d8d8;font-variant-numeric:tabular-nums;flex:none}
.progress{flex:1;height:3px;background:rgba(255,255,255,.28);border-radius:2px;
  cursor:pointer;position:relative}
.progress .fill{position:absolute;inset:0 auto 0 0;width:0;background:#fff;border-radius:2px;
  box-shadow:0 0 6px rgba(255,255,255,.5)}
.progress .knob{position:absolute;top:50%;left:0;width:9px;height:9px;border-radius:50%;
  background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,255,255,.7)}
.transport{flex:none;display:flex;align-items:center;gap:6px}
.tbtn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .18s,transform .18s;background:transparent}
.tbtn:hover{background:rgba(255,255,255,.14);transform:scale(1.12)}
.tbtn svg{width:18px;height:18px;fill:#fff}

/* mobile */
@media (max-width:560px){
  .presence{flex-direction:row}
}
</style>
</head>

/* ---- music reactor: live spectrum from the playing track ---- */
let actx = null, analyser = null, freq = null;
function initReactor(){
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaElementSource(track);
    analyser = actx.createAnalyser();
    analyser.fftSize = 64;
    analyser.smoothingTimeConstant = 0.78;
    freq = new Uint8Array(analyser.frequencyBinCount);
    src.connect(analyser);
    analyser.connect(actx.destination);
    drawReactor();
  } catch { /* reactor off if audio routing fails; playback unaffected */ }
}
function drawReactor(){
  const cv = document.getElementById('reactor');
  if (!cv || !analyser) return;
  const ctx = cv.getContext('2d');
  const LYR_GRAD = ctx.createLinearGradient(0, 0, 0, cv.height);   // one shared gradient, not 7 per frame
  LYR_GRAD.addColorStop(0, 'rgba(180,215,255,.7)');
  LYR_GRAD.addColorStop(0.5, 'rgba(255,255,255,.98)');
  LYR_GRAD.addColorStop(1, 'rgba(180,215,255,.7)');
  const bars = 7, gap = 6;
  const w = cv.width, h = cv.height;
  const bw = (w - gap * (bars - 1)) / bars;
  // four frequency groups, mirrored around the horizontal center
  const groups = 4, gstep = Math.floor(freq.length / groups);
  let rafLast = 0;
  const loop = (ts) => {
    requestAnimationFrame(loop);
    if (ts - rafLast < 33) return;      // ~30fps enough
    rafLast = ts;
    analyser.getByteFrequencyData(freq);
    ctx.clearRect(0, 0, w, h);
    const mid = h / 2;
    const c = (bars - 1) / 2;
    for (let i = 0; i < bars; i++) {
      const n = Math.round(Math.abs(i - c));
      // edges share a lively mid band instead of near-silent treble
      const band = Math.min(n, groups - 2);
      let sum = 0;
      for (let j = 0; j < gstep; j++) sum += freq[band * gstep + j];
      const v = (sum / gstep / 255) * (1 - n * 0.16);   // gentle falloff toward the edges
      const bh = Math.max(3, v * (h - 6));
      const x = w / 2 + (i - c) * (bw + gap) - bw / 2;
      // grow outwards from the vertical middle, mirrored up + down
      ctx.fillStyle = LYR_GRAD;
      ctx.beginPath();
      ctx.roundRect(x, mid - bh / 2, bw, bh, bw / 2);
      ctx.fill();
    }
  };
  requestAnimationFrame(loop);
}

function lyrParseLrc(lrcText){
  const out = [];
  for (const raw of lrcText.split(/\r?\n/)) {
    const times = [...raw.matchAll(/\[(\d+)[:.](\d+)(?:[.:](\d+))?\]/g)];
    if (!times.length) continue;
    const text = raw.replace(/\[.*?\]/g, '').trim();
    if (!text) continue;
    for (const m of times) {
      const t = parseInt(m[1]) * 60 + parseInt(m[2]) + (m[3] ? parseInt(m[3].padEnd(3, '0')) / 1000 : 0);
      out.push({ t, text });
    }
  }
  return out.sort((a, b) => a.t - b.t);
}

  const parsed = lyrParseLrc(lrcText);

    const handTimes = (taps && Array.isArray(taps) && taps.length === lrc.length) ? taps : null;

}
function tapExit(){

document.addEventListener('keydown', (e) => {

        for (const k of z.keepOut) { if (overlapArea(grown, k) > 0) return k.y1 + 16; }
        for (const L of lyrLive) {

          const r = { x0: L.x0 - padX(L), y0: L.y0 - 14, x1: L.x1 + padX(L), y1: L.y1 + 18 };

/* live-chunk registry: so placement knows what's currently on screen */
let lyrLive = [];
let lineSeq = 0;
/* last spawned line's full stack — the anchor a continuation line centers beneath */
let lyrLastLine = null;
function lyrPrune(){
  const now = performance.now();

}
function overlapArea(a, b){
  const w = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
  const h = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);

function lyrFindSlot(z, w, totalH, M){

function lyricTick(t){

  const stride = (track.duration - 4.5) / Math.max(1, N - 1);
  for (const L of lyr.lines) {
    const lt = (L.base != null ? L.base : 1.9 + lyr.lines.indexOf(L) * stride) + (lyrNudgeVal || 0);
